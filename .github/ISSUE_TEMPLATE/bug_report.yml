name: Bug report
description: Report reproducible exporter behavior that looks incorrect.
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not paste Braiins API tokens, payout addresses, transaction IDs, worker names from private environments, raw API responses, private URLs, IP addresses, or infrastructure details.
  - type: input
    id: version
    attributes:
      label: Exporter version or commit
      description: Use `/version`, the image tag, or the Git commit.
      placeholder: "v0.1.0 or 0000000"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Standalone binary
        - Docker
        - Docker Compose
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, Windows 11, macOS, etc."
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Sanitized configuration
      description: Include relevant flags and environment variable names only. Replace values with placeholders.
      placeholder: |
        BRAIINS_POOL_TOKEN_FILE=<redacted>
        BRAIINS_POOL_COIN=btc
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: List exact steps using sanitized commands and fixtures.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized logs or metric snippets only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy checklist
      options:
        - label: I removed API tokens, payout addresses, transaction IDs, worker names from private environments, private URLs, IP addresses, and raw API responses.
          required: true
